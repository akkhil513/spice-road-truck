# ── Server ──────────────────────────────────────
quarkus.http.port=8080

# ── DynamoDB ────────────────────────────────────
quarkus.dynamodb.aws.region=us-east-1
quarkus.dynamodb.aws.credentials.type=default

# ── CORS ────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://spiceroadtruck-frontend.s3-website-us-east-1.amazonaws.com,https://spiceroadtruck.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization

quarkus.package.jar.type=legacy-jar
# ── Table names (required in prod; injected by template.yaml) ──
srt.tables.dishes=${SRT_DISHES_TABLE}
srt.tables.orders=${SRT_ORDERS_TABLE}
%dev.srt.tables.dishes=srt-dishes-dev
%dev.srt.tables.orders=srt-orders-dev
%test.srt.tables.dishes=srt-dishes-test
%test.srt.tables.orders=srt-orders-test

# ── Logging ─────────────────────────────────────
quarkus.log.level=INFO
%dev.quarkus.log.level=DEBUG
