# ── Server ──────────────────────────────────────
quarkus.http.port=8080

# ── DynamoDB ────────────────────────────────────
quarkus.dynamodb.aws.region=us-east-1
quarkus.dynamodb.aws.credentials.type=default

# ── CORS ────────────────────────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,http://spiceroadtruck-frontend.s3-website-us-east-1.amazonaws.com,https://spiceroadtruck.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Accept,Authorization

# ── Security ────────────────────────────────────
# Map cognito:groups claim → Quarkus roles (active in prod/staging where API GW
# validates the JWT before Lambda runs and injects the verified claims).
quarkus.lambda-http.map-cognito-to-roles=true
quarkus.lambda-http.cognito-role-claim=cognito:groups
# Dev: no API Gateway in front — DevSecurityAugmentor grants all roles instead.
%dev.quarkus.lambda-http.map-cognito-to-roles=false

quarkus.package.jar.type=legacy-jar
# Buffer whole responses so they carry Content-Length instead of chunked encoding.
# Above the 8191-byte default, the Lambda HTTP dev emulator sends an empty
# Transfer-Encoding header and clients hang waiting for the body to end.
%dev.quarkus.rest.output-buffer-size=262144

# ── Table names (required in prod; injected by template.yaml) ──
srt.data.table=${SRT_TABLE}
%dev.srt.data.table=srt-data-dev
%test.srt.data.table=srt-data-test

# ── Order rules ─────────────────────────────────
srt.orders.tax-rate=${SRT_TAX_RATE:0.08}
srt.orders.timezone=${SRT_TIMEZONE:America/New_York}
srt.orders.max-lines=25
srt.orders.max-quantity=20

# ── Logging ─────────────────────────────────────
quarkus.log.level=INFO
# Dev: DEBUG for our code only; keep framework/JDK internals at INFO
%dev.quarkus.log.category."com.spiceroad".level=DEBUG
%dev.quarkus.log.category."com.spiceroad".min-level=DEBUG
%dev.quarkus.log.category."io.quarkus.amazon.lambda".level=DEBUG
