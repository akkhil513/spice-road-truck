AWSTemplateFormatVersion: '2010-09-09'
Description: SRT Backend Template

Parameters:
  Environment:
    Type: String
    Description: The environment to deploy to (e.g., dev, prod)
    AllowedValues:
      - dev
      - si
      - prod
  TaxRate:
    Type: String
    Default: '0.08'
    Description: Sales tax as a fraction (0.08 = 8%)
    AllowedPattern: '^0(\.[0-9]{1,4})?$'
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: 'https://spiceroadtruck.com,https://www.spiceroadtruck.com,http://localhost:3000'
    Description: Browser origins allowed to call the API (set per environment)
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID (e.g. us-east-1_xxxxxxxx)
  CognitoAppClientId:
    Type: String
    Description: Cognito SPA App Client ID (no secret)

Conditions:
  IsProd: !Equals [ !Ref Environment, prod ]

Resources:
  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub srt-data-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: category, AttributeType: S }
        - { AttributeName: gsiOpen, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - { AttributeName: category, KeyType: HASH }
            - { AttributeName: sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # Sparse index: only orders that are still open carry gsiOpen
        - IndexName: open-index
          KeySchema:
            - { AttributeName: gsiOpen, KeyType: HASH }
            - { AttributeName: sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub srt-lambda-execution-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt DataTable.Arn
                  - !Sub '${DataTable.Arn}/index/*'
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/srt-dishes-lambda-${Environment}
      RetentionInDays: 1

  SRTDishesLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub srt-dishes-lambda-${Environment}
      Runtime: java21
      Handler: io.quarkus.amazon.lambda.runtime.QuarkusStreamHandler::handleRequest
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: srt-deployments-bucket
        S3Key: !Sub lambda/srt-backend-${Environment}.zip
      Environment:
        Variables:
          SRT_TABLE: !Ref DataTable
          SRT_TAX_RATE: !Ref TaxRate
          SRT_TIMEZONE: America/New_York
          ENVIRONMENT: !Ref Environment

  ApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub srt-api-${Environment}
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiGateway
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SRTDishesLambdaFunction.Arn
      PayloadFormatVersion: '2.0'

  # JWT authorizer — validates Cognito ID tokens before protected routes reach Lambda
  CognitoAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref ApiGateway
      AuthorizerType: JWT
      Name: CognitoAuthorizer
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Issuer: !Sub "https://cognito-idp.us-east-1.amazonaws.com/${CognitoUserPoolId}"
        Audience:
          - !Ref CognitoAppClientId

  # ── Public routes (no auth required) ────────────────────────────────────────
  GetDishesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'GET /srt/v1/dishes'
      Target: !Sub integrations/${LambdaIntegration}
      AuthorizationType: NONE

  GetDishByIdRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'GET /srt/v1/dishes/{id}'
      Target: !Sub integrations/${LambdaIntegration}
      AuthorizationType: NONE

  PostOrdersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /srt/v1/orders'
      Target: !Sub integrations/${LambdaIntegration}
      AuthorizationType: NONE

  # ── Protected routes (valid Cognito JWT required) ────────────────────────────
  PostDishesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'POST /srt/v1/dishes'
      Target: !Sub integrations/${LambdaIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  PutDishesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'PUT /srt/v1/dishes/{id}'
      Target: !Sub integrations/${LambdaIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  DeleteDishesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'DELETE /srt/v1/dishes/{id}'
      Target: !Sub integrations/${LambdaIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  GetOrdersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'GET /srt/v1/orders'
      Target: !Sub integrations/${LambdaIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  PutOrderStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGateway
      RouteKey: 'PUT /srt/v1/orders/{sk}/status'
      Target: !Sub integrations/${LambdaIntegration}
      AuthorizationType: JWT
      AuthorizerId: !Ref CognitoAuthorizer

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGateway
      StageName: '$default'
      AutoDeploy: true

  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SRTDishesLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*/srt/*

Outputs:
  DataTableArn:
    Description: The ARN of the single DynamoDB table (dishes, orders, counters)
    Value: !GetAtt DataTable.Arn
    Export:
      Name: !Sub srt-data-table-arn-${Environment}

  ApiEndpoint:
    Description: The endpoint of the API Gateway
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com
    Export:
      Name: !Sub srt-api-endpoint-${Environment}

  LambdaArn:
    Description: The ARN of the Lambda function
    Value: !GetAtt SRTDishesLambdaFunction.Arn
    Export:
      Name: !Sub srt-lambda-arn-${Environment}
